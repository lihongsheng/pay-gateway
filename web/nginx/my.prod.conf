map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

server {
    listen       8080;
    server_name localhost;
    client_max_body_size 1024m;
    #charset koi8-r;
    #access_log  logs/host.access.log  main;

    location / {
        root /usr/share/nginx/html;
        add_header Cache-Control 'no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0';
        try_files $uri $uri/ /index.html;
    }

	# WebSocket连接 - 必须放在/api之前，确保正确匹配
    location /kubernetes/pods/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # WebSocket必要设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;

        # 增加超时时间，防止WebSocket连接过早关闭
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;

        # 直接代理到后端服务，路径保持不变
        proxy_pass http://gva-server:8888;
    }

    # WebSocket连接 - 必须放在/api之前，确保正确匹配
    location /resourceManage/projectResource/ws/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        # WebSocket必要设置
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        # 增加超时时间，防止WebSocket连接过早关闭
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 3600s;
        # 直接代理到后端服务，路径保持不变
        proxy_pass http://gva-server:8888;
    }

    # SSE连接专用配置 - 必须放在/api之前，确保正确匹配
    location /api/sse/ {
        proxy_set_header Host $http_host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        
        # SSE必要设置
        proxy_http_version 1.1;
        
        # 禁用缓冲，确保SSE数据实时传输
        proxy_buffering off;
        proxy_cache off;
        
        # 设置SSE连接超时时间
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
        proxy_connect_timeout 60s;
        
        # 设置SSE相关的HTTP头
        proxy_set_header Connection '';
        proxy_set_header Cache-Control 'no-cache';
        proxy_set_header X-Accel-Buffering 'no';
        
        # 重写路径：/api/sse/xxx -> /sse/xxx
        rewrite ^/api/sse/(.*)$ /sse/$1 break;
        proxy_pass http://gva-server:8888;
    }

    location /api {
        proxy_set_header Host $http_host;
        proxy_set_header  X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        rewrite ^/api/(.*)$ /$1 break;         #重写
        proxy_pass http://gva-server:8888;     # 设置代理服务器的协议和地址
     }

    location /api/swagger/index.html {
        proxy_pass http://gva-server:8888/swagger/index.html;
     }
 }
